    <script>
      // Dispara "Lead" quando o visitante clica em qualquer botão/link que leva à
      // plataforma de inscrição. É o melhor sinal de intenção de cadastro no site
      // do Prêmio (o cadastro em si é concluído na plataforma boaspraticas).
      document.addEventListener('click', function (e) {
        var a = e.target && e.target.closest
          ? e.target.closest('a[href*="boaspraticas.infosfera.inf.br"]')
          : null;
        if (a && window.fbq) { window.fbq('track', 'Lead'); }
      }, true);
    </script>
